spring:
  application:
    name: backend
  datasource:
    url: jdbc:sqlite:/workdir/database/database.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

server:
  port: 8081

CorsAllowedOrigin: http://localhost:5174