spring:

  application:
    name: backend

  server:
    address: 0.0.0.0
    
  datasource:
    # SQLite DB path configurable via SQLITE_DB_PATH environment variable
    url: jdbc:sqlite:${SQLITE_DB_PATH}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect

CorsAllowedOrigin: ${CORS_ALLOWED_ORIGIN}